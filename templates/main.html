<!DOCTYPE html>
<html>
<head>
    <title>Library Management</title>

    <style>

        body{
            font-family: Arial;
            margin: 0;
            background-color: #f4f4f4;
        }

        .navbar{
            background-color: rgb(6, 70, 120);
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .navbar a{
            color: white;
            text-decoration: none;
            margin-right: 20px;
            text-align: center;
            font-size: 20px;
        }

        table{
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th{
            background-color: lightblue;
        }

        form{
            width: 40%;
            margin: auto;
            margin-top: 30px;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button{
            padding: 10px 20px;
            margin-top: 10px;
        }

    </style>
</head>

<body>

<div class="navbar">
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'create' %}">Add Book</a>
    <a href="{% url 'display' %}">Display Books</a>

</div>

{% block content %}

{% endblock %}

</body>
</html>
